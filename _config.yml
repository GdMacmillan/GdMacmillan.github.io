# Website details
name: Gordon MacMillan
description: Data Science Professional
email: gmacilla@ymail.com
author: Gordon MacMillan
lang: English
locale: Denver, CO
url: https://gdmacmillan.github.io
baseurl: ""

# Jekyll
paginate: 10
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

timezone: America/Denver
paginateLabel: page
paginate_path: "page/:num"
permalink: /:categories/:year/:month/:day/:title

#Sitemap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/404.html"
    include_posts:
        - "/index.html"
    change_frequency_name: "daily"
    priority_name: "1.00"
