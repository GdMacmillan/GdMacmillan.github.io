---
layout: default
---

<!-- Article -->
<article class="noBorder">

	<!-- Article title -->
	<h1>{{ page.title }}</h1>

	<!-- Article date -->
	<span class="article__date">
		{{ page.date | date_to_long_string | upcase }}
	</span>

	<!-- Article description -->
	<section>{{ page.content }}</section>

</article><!-- article -->
